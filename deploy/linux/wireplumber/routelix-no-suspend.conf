# WirePlumber 0.5+. Ubuntu 24.04 ships 0.4 and uses the Lua file instead.
# Install to /etc/wireplumber/wireplumber.conf.d/routelix-no-suspend.conf
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~routelix_.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
